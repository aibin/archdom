    style: depends
    sourceAnchor: bottom
  - from: audit
    to: ledger-db
    label: Append audit entries
    style: sync
    sourceAnchor: bottom
  - from: job-queue
    to: payroll
    label: Trigger scheduled runs
    style: async
  - from: job-queue
    to: reporting
    label: Generate scheduled reports
    style: async
    sourceAnchor: bottom
  - from: job-queue
    to: banking
    label: Trigger bank syncs
    style: async
